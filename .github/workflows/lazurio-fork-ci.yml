name: Lazurio Fork CI

# Read-only CI for the Lazurio overlay on upstream OpenMausBot. Upstream
# workflows publish to npm, GHCR and release mirrors and are disabled in this
# repository's Actions settings; see docs/operations/lazurio-fork-release.md.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: none

concurrency:
  group: lazurio-fork-ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UPSTREAM_TAG: v0.1.91
  UPSTREAM_SHA: 1078681831b10435045195e5bff29ef790654d84
  UPSTREAM_REPOSITORY: https://github.com/milind-soni/OpenMausBot.git

jobs:
  overlay:
    name: Overlay, typecheck and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      - name: Fetch exact source and upstream base without credentials
        env:
          SOURCE_REF: ${{ github.event.pull_request.head.sha || github.sha }}
          SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
        run: |
          set -euo pipefail
          git init .
          git remote add source "https://github.com/${SOURCE_REPOSITORY}.git"
          git fetch --filter=blob:none source "$SOURCE_REF"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SOURCE_REF"

          git remote add upstream "$UPSTREAM_REPOSITORY"
          git fetch --filter=blob:none upstream \
            "refs/tags/$UPSTREAM_TAG:refs/tags/upstream-$UPSTREAM_TAG"
          test "$(git rev-parse "refs/tags/upstream-$UPSTREAM_TAG^{commit}")" = "$UPSTREAM_SHA"
          git merge-base --is-ancestor "$UPSTREAM_SHA" HEAD
          test "$(git rev-list --merges "$UPSTREAM_SHA..HEAD" --count)" = 0

          # The overlay adds Lazurio files and changes only the upstream files
          # below. Each entry is a reviewed decision; a change to any other
          # upstream file, or deleting or renaming one, fails.
          allowed_upstream_changes=(
            # OMB_DEFAULT_BOT_CWD, a default working folder for new bots.
            docs/self-hosting.md
            scripts/control-omb.ts
            server/bot-cwd.ts
            server/index.ts
            server/store.ts
            # The GitHub intake: WebhookManager.deliver() hands its events to
            # the webhook queue in-process. Its wiring also changes
            # server/index.ts and scripts/control-omb.ts, listed above.
            server/webhooks.ts
            # OMB_HEADLESS_FULL_ACCESS, the operator's opt-in to Full access
            # over the API, changes only files listed above: server/index.ts,
            # scripts/control-omb.ts and docs/self-hosting.md.
            # Live browser fixes (issues #13, #14), an upstream-ready commit
            # carried until upstream takes it: a fixed page size for the
            # headless browser, clicks mapped into the page the frames show,
            # and a view that waits while the bot holds the browser. Its
            # wiring also changes server/index.ts, listed above.
            server/browser-engine.ts
            server/browser-engine.test.ts
            server/browser-live.ts
            server/browser-live.test.ts
            server/browser-runtime.ts
            server/browser-runtime.test.ts
            src/components/BrowserPanel.tsx
            src/components/BrowserPanel.test.ts
            src/components/BrowserViewport.tsx
            src/components/BrowserViewport.test.ts
          )
          unexpected="$(git diff --name-only --diff-filter=MDRT "$UPSTREAM_SHA..HEAD" |
            grep -vxF -f <(printf '%s\n' "${allowed_upstream_changes[@]}") || true)"
          if [ -n "$unexpected" ]; then
            echo "Fork overlay changed upstream files outside allowed_upstream_changes:" >&2
            echo "$unexpected" >&2
            exit 1
          fi

      - name: Upstream workflows stay disabled
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          active="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows?per_page=100" \
            --jq '.workflows[] | select(.state == "active") | select(.path | test("^\\.github/workflows/lazurio-") | not) | .path')"
          if [ -n "$active" ]; then
            echo "Upstream workflows are enabled in this fork; disable them (runbook: Automation boundary):" >&2
            echo "$active" >&2
            exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: pnpm install --frozen-lockfile

      - name: Validate the Lazurio release contract
        run: node --test scripts/lazurio-release-contract.node-test.mjs

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

  # Upstream's own suite, sharded the way upstream ci.yml runs it on Linux.
  vitest:
    name: vitest (shard ${{ matrix.shard }}/4)
    needs: overlay
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Fetch exact source without credentials
        env:
          SOURCE_REF: ${{ github.event.pull_request.head.sha || github.sha }}
          SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
        run: |
          set -euo pipefail
          git init .
          git remote add source "https://github.com/${SOURCE_REPOSITORY}.git"
          git fetch --no-tags --depth=1 source "$SOURCE_REF"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SOURCE_REF"

      - name: Install pnpm
        uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare Electron test runtime
        run: node --input-type=commonjs -e "require('electron')"

      - name: Run tests
        run: pnpm exec vitest run --shard=${{ matrix.shard }}/4 --reporter=default --reporter=github-actions

      - name: Broker and Electron unit tests
        if: matrix.shard == 1
        run: pnpm broker:test && pnpm test:electron

  # The same archive build and smoke the release runs, under the
  # never-released version <upstream>-lazurio.0. Keep it in step with UPSTREAM_TAG.
  archive:
    name: Archive
    uses: ./.github/workflows/lazurio-archive.yml
    with:
      version: 0.1.91-lazurio.0
      source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      source_repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
